<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习笔记</title>
<meta name="description" content="学习笔记索引 —— 把零散的知识整理成可以反复查阅的路径">
<!--
  用法说明
  ------------------------------------------------------------------
  1. 整页只有一个文件，直接上传到仓库根目录，命名为 index.html 即可。
  2. 想再加一条笔记：复制下面 <a class="card"> ... </a> 整块，
     把 href 换成新网址、标题和描述换掉就行。
  3. real 的卡片是可点击的 <a>；还没做好的可以先用 <div class="card soon">。
-->
<style>
  :root {
    --bg: #f6f8fa;
    --fg: #1f2328;
    --muted: #59636e;
    --card: #ffffff;
    --border: #d8dee4;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --card: #151b23;
      --border: #3d444d;
      --accent: #4493f8;
      --accent-soft: #121d2f;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- 顶部 ---------- */
  .hero {
    padding: 88px 0 40px;
    text-align: center;
  }

  .badge {
    display: inline-block;
    padding: 4px 12px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 38px;
    line-height: 1.25;
    letter-spacing: -0.5px;
  }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
  }

  /* ---------- 列表 ---------- */
  .section-title {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .cards {
    display: grid;
    gap: 14px;
    padding-bottom: 24px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }

  a.card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(9, 105, 218, .12);
  }

  a.card:active { transform: translateY(0); }

  a.card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .icon {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: linear-gradient(135deg, #0969da, #8250df);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
    user-select: none;
  }

  .icon.alt {
    background: linear-gradient(135deg, #1a7f37, #2da44e);
    font-size: 18px;
  }

  .body { min-width: 0; }

  .body h3 {
    margin: 0 0 4px;
    font-size: 17px;
    font-weight: 600;
  }

  .body p {
    margin: 0;
    color: var(--muted);
    font-size: 13.5px;
  }

  .arrow {
    flex: 0 0 auto;
    margin-left: auto;
    padding-left: 12px;
    color: var(--muted);
    font-size: 18px;
    transition: transform .16s ease, color .16s ease;
  }

  a.card:hover .arrow {
    color: var(--accent);
    transform: translateX(4px);
  }

  /* 未完成的条目 */
  .card.soon {
    opacity: .55;
    border-style: dashed;
  }

  .card.soon .icon {
    background: var(--border);
    color: var(--muted);
  }

  .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 500;
    vertical-align: 2px;
  }

  /* ---------- 页脚 ---------- */
  footer {
    margin-top: 24px;
    padding: 28px 0 48px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
  }

  footer a {
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
  }

  footer a:hover { color: var(--accent); }

  @media (max-width: 480px) {
    .hero { padding-top: 56px; }
    h1 { font-size: 30px; }
    .card { padding: 16px; gap: 13px; }
    .icon { width: 42px; height: 42px; border-radius: 10px; }
    .body h3 { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <span class="badge">Study Notes</span>
    <h1>学习笔记</h1>
    <p class="sub">把零散的知识，整理成可以反复查阅的路径。</p>
  </header>

  <main>
    <h2 class="section-title">全部笔记</h2>

    <div class="cards">

      <!-- ▼ Basic C++ ：点击整块卡片即可跳转 ▼ -->
      <a class="card" href="https://diyuzai.github.io/basic-cpp/" aria-label="打开 Basic C++ 笔记">
        <span class="icon">C++</span>
        <div class="body">
          <h3>Basic C++</h3>
          <p>从零开始的 C++ 基础教程：语法、数据类型、分支循环、数组、函数、STL。</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <!-- ▲ 想加新笔记，就复制上面这一整块，改 href 和文字 ▲ -->

      <div class="card soon">
        <span class="icon alt">＋</span>
        <div class="body">
          <h3>更多笔记<span class="tag">整理中</span></h3>
          <p>新的学习路径正在整理，敬请期待。</p>
        </div>
        <span class="arrow" aria-hidden="true">·</span>
      </div>

    </div>
  </main>

  <footer>
    <p>
      学习笔记 · Hosted on
      <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>
      · <span id="year">2026</span>
    </p>
  </footer>

</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
